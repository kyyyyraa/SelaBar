name: Release SelaBar

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve release version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "v0.2.0" }
          $ver = $tag -replace '^v', ''
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run automated unit tests
        run: cargo test -- --skip resolves_whisper_cuda_and_model_locally --skip edge_tts_live_smoke_test

      - name: Build SelaBar release binary
        run: cargo build --release --bin SelaBar

      - name: Package portable release artifacts
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\package-release.ps1 -SkipBuild -Version "$env:APP_VER"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SelaBar ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/SelaBar-v*-Setup.exe
            dist/SelaBar.exe
            dist/*.zip
